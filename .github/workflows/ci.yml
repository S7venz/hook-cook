name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Grails / Spock)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x backend/gradlew

      - name: Run tests + JaCoCo
        working-directory: backend
        run: ./gradlew --no-daemon test jacocoTestReport --console=plain

      - name: Run CodeNarc (analyse statique Groovy)
        working-directory: backend
        run: ./gradlew --no-daemon codenarcMain --console=plain

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/

      - name: Upload CodeNarc report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-codenarc
          path: backend/build/reports/codenarc/

  frontend:
    name: Frontend (Vite / Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests + couverture
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Démarrer l'app (docker compose)
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis backend
          # Front rebuild rapide local plutôt que docker pour fiabilité CI
          docker compose up -d frontend
          # Attendre que le front répond
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173/ >/dev/null && break
            sleep 2
          done

      - name: Install deps + Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          # Mot de passe admin = celui du seed (.env.example)
          HC_E2E_ADMIN_PASSWORD: admin1234demo
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Stop compose
        if: always()
        run: docker compose down -v || true
